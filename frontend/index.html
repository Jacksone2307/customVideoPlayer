<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111313">
    <meta name="description" content="A personal home for your video collection.">
    <title>Stillroom — your video library</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <video-datasource>
        <div class="page-shell">
            <header class="site-header">
                <a class="brand" href="/" aria-label="Stillroom home">
                    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>stillroom</span>
                </a>
                <span class="private-label"><span class="status-dot"></span> Your personal library</span>
            </header>

            <main>
                <section class="intro">
                    <div class="intro-copy">
                        <p class="eyebrow">A LITTLE SPACE FOR THE BIG SCREEN</p>
                        <h1>Stories worth<br><span>coming back to.</span></h1>
                        <p class="intro-description">Your videos, collected in one calm corner of the internet.</p>
                    </div>
                    <div class="intro-art" aria-hidden="true">
                        <div class="orbit orbit-one"></div>
                        <div class="orbit orbit-two"></div>
                        <div class="art-disc"><span class="art-play">▶</span></div>
                        <span class="art-star star-one">✳</span>
                        <span class="art-star star-two">✳</span>
                    </div>
                </section>

                <section class="library-layout" aria-label="Video library">
                    <video-player></video-player>
                    <video-catalogue></video-catalogue>
                </section>
            </main>

            <footer class="site-footer">
                <span>Made for your own little corner of the world.</span>
                <span>STILLROOM <span class="footer-divider">/</span> PERSONAL VIDEO LIBRARY</span>
            </footer>
        </div>
    </video-datasource>
    <script type="module" src="/components/video-datasource.js"></script>
</body>
</html>
